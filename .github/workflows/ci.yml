name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # .tool-versions (asdf) pins Go and golangci-lint.
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions

      - name: go.mod is tidy
        run: go mod tidy -diff

      - name: Build and test
        run: make build test

      - name: Read golangci-lint version
        id: tools
        run: echo "golangci=v$(awk '$1 == "golangci-lint" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.tools.outputs.golangci }}
